name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/stretchly_server_test
      MIN_STRETCHLY_VERSION: 1.6.0
    services:
      postgres:
        image: postgres:10
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.13
      - name: Install Bundler
        run: gem install bundler
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
      - name: Setup the Rails application
        env:
          RAILS_ENV: test
        run: |
          sudo apt-get -yqq install libpq-dev
          bundle config set deployment false
          bundle install --jobs 4 --retry 3
          bundle exec rails db:create
          bundle exec rails db:migrate
          yarn --frozen-lockfile
      - name: Build assets for browser tests
        run: |
          yarn build
          yarn build:css
      - name: Run unit tests
        run: bundle exec rails test
      - name: Run system tests
        run: bundle exec rails test:system
      - name: Check Hatchbox asset tasks
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: '1'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stretchly_server_test
        run: |
          bundle exec rails assets:precompile
          bundle exec rails assets:clean
      - name: Upload system test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots
          path: tmp/screenshots/*.png
          if-no-files-found: ignore
